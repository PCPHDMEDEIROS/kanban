<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban PCP · HD Medeiros</title><link rel="stylesheet" href="./css/app.css"><link rel="stylesheet" href="./css/pcp.css"><link rel="stylesheet" href="./css/pcp-kanban.css"><style>[hidden]{display:none!important}</style></head><body>
<section id="login" class="login"><form id="login-form"><h1>Kanban PCP</h1><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button><small id="login-error"></small></form></section>
<main id="app" hidden><header><div class="brand"><strong>HD Medeiros</strong><span>Kanban PCP</span></div><nav aria-label="Navegação principal"><a href="./">Kanban Operacional</a><a class="active" href="./pcp-kanban.html">Kanban PCP</a><a href="./pcp-programacao.html">Programar Produção</a><a href="./pcp-indicadores.html">Indicadores</a></nav><div class="session"><span id="sync-status"></span><span id="user-label"></span><button id="logout">Sair</button></div></header>
<section class="pcp-toolbar"><label>Visualização<select id="mode"><option value="FURNACE">Por forno</option><option value="LOT">Por lote</option></select></label><label class="grow">Pesquisa<input id="search" placeholder="Série, lote, modelo ou cliente"></label><label>Ordenar<select id="order"><option value="DELIVERY">Prazo de entrega</option><option value="PRIORITY">Prioridade</option><option value="SERIAL">Série ou lote</option><option value="MODEL">Modelo</option></select></label><label>Histórico<select id="history"><option value="ACTIVE">Somente ativos</option><option value="ALL">Incluir concluídos</option></select></label><label><input id="hide-empty" type="checkbox"> Ocultar semanas vazias</label><button id="refresh" type="button">Atualizar</button></section>
<p id="board-status" class="board-status" role="status"></p><section id="unassigned" class="unassigned" hidden></section><section id="board" class="board" aria-live="polite"></section></main>
<dialog id="detail-dialog" class="pcp-dialog" aria-labelledby="detail-title"><div class="dialog-head"><div><h2 id="detail-title">Detalhes</h2><small id="detail-subtitle"></small></div><button id="detail-close" aria-label="Fechar">×</button></div><div id="detail-body" class="dialog-body"></div></dialog>
<dialog id="all-dialog" class="pcp-dialog" aria-labelledby="all-title"><div class="dialog-head"><h2 id="all-title">Todos os itens</h2><button id="all-close" aria-label="Fechar">×</button></div><div id="all-body" class="dialog-body"></div></dialog>
<script type="module" src="./js/pcp-kanban.js"></script></body></html>
